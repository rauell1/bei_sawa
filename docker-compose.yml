services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    command: ["serve"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 10s
    restart: unless-stopped

  qwen-model:
    image: ollama/ollama:latest
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      # Local-only stack. The public Render image keeps auth enabled.
      BEISAWA_ENGINE_REQUIRE_AUTH: "0"
      BEISAWA_LLM_MODE: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      BEISAWA_HOME: /app
      BEISAWA_DATA_DIR: /app/backend/beisawa/data
      BEISAWA_RUNTIME_DIR: /app/var
      MCP_FILESYSTEM_COMMAND: /usr/local/bin/mcp-server-filesystem
    volumes:
      - ./var:/app/var
    expose:
      - "8000"
    depends_on:
      qwen-model:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    environment:
      BEISAWA_DEPLOYMENT_MODE: local
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-data:
