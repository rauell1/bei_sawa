[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bei-sawa"
version = "0.1.0"
description = "BeiSawa: an auditable value-for-money review agent for OCDS procurement records"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roy Okola Otieno" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.23,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
beisawa = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
